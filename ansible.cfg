[defaults]
# Point to the inventory directory — Ansible will pick up hosts.yml
# and the adjacent group_vars/ and host_vars/ automatically.
inventory         = inventory
roles_path        = roles
host_key_checking = False
# How many hosts to operate on in parallel (default: 5).
# With 2 targets both will run at exactly the same time.
forks             = 5

[ssh_connection]
# Pipelining eliminates the SFTP file-transfer step for each task by piping
# module code directly over the existing SSH connection. This gives a
# significant speed improvement for playbooks with many tasks (the CIS roles
# run 200+ tasks per host).
#
# Requirement: 'Defaults requiretty' must NOT be set in /etc/sudoers.
# Debian 12 and Ubuntu 22.04 ship without requiretty, so this is safe here.
# If you add hosts running an OS that does set requiretty (e.g. older RHEL),
# either remove that sudoers line or disable pipelining for those hosts.
pipelining        = True
