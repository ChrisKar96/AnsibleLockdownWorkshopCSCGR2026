---
# playbooks/audit.yml
#
# Runs the Goss compliance audit against all hosts in the [cis] group
# in READ-ONLY mode. No system changes are applied.
#
# After the audit completes, each role's built-in fetch mechanism copies the
# Goss report back to the controller into:
#   reports/<hostname>/<hostname>-<benchmark>-<version>_pre_scan_<epoch>.<format>
#
# The report format is controlled by audit_report_format in group_vars/all.yml
# (json by default). Switch to html for a browser-viewable report.
#
# Usage:
#   # Before hardening — establish a baseline
#   ansible-playbook playbooks/audit.yml
#
#   # After hardening — measure improvement
#   ansible-playbook playbooks/audit.yml

# Play 1 — Download the Goss binary to the Ansible Controller.
# The targets are assumed to have no outbound internet access, so we fetch
# the binary once here and the CIS roles copy it from the controller
# (get_audit_binary_method: copy in group_vars/all.yml).
- name: Download Goss binary to Ansible Controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _goss_version: v0.4.8
    _goss_arch: AMD64
  tasks:
    - name: Download Goss {{ _goss_version }} binary
      ansible.builtin.get_url:
        url: "https://github.com/goss-org/goss/releases/download/{{ _goss_version }}/goss-linux-{{ _goss_arch }}"
        dest: "/tmp/goss-linux-{{ _goss_arch }}"
        mode: '0755'
        checksum: "sha256:85d00b7bba5f175bec95de7dfe1f71f8f25204914aad4c6f03c8457868eb6e2f"

# Play 2 — Run the compliance audit on all targets.
- name: CIS Compliance Audit
  hosts: cis
  become: true
  gather_facts: true  # also populates ansible_date_time for report timestamps
  vars:
    audit_only: true   # override group_vars/all.yml — no changes, audit only
    # audit_format lives in the role's vars/ (higher precedence than group_vars),
    # so it must be overridden here at play level.
    audit_format: "{{ audit_report_format }}"

  tasks:

    - name: Audit with DEBIAN12-CIS
      ansible.builtin.include_role:
        name: DEBIAN12-CIS
      when:
        - ansible_distribution == "Debian"
        - ansible_distribution_major_version == "12"

    - name: Audit with UBUNTU22-CIS
      ansible.builtin.include_role:
        name: UBUNTU22-CIS
      when:
        - ansible_distribution == "Ubuntu"
        - ansible_distribution_major_version == "22"
