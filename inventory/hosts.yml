---
# Hosts are grouped by CIS benchmark level, not by OS.
# The correct hardening role is selected automatically at runtime
# by detecting each host's OS. See playbooks/ for details.
#
# The [cis] group is the parent of all level groups — playbooks
# target [cis] and group_vars for each level group apply automatically.
#
# To add a new server: place it in cis_level1 or cis_level2.
# Nothing else needs to change.

all:
  children:
    cis:
      children:

        # CIS Level 1 — essential hardening, minimal operational impact.
        # Recommended starting point for all servers.
        cis_level1:
          hosts:
            ansible-controller:   # the controller hardens itself via local connection
            debian-target:
            ubuntu-target:

        # CIS Level 2 — deeper hardening; may break certain functionality.
        # Review carefully before adding hosts here.
        cis_level2:
          hosts:
            # (no hosts assigned yet — add servers here when ready)
