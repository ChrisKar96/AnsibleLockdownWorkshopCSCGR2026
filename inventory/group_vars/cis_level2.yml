---
# group_vars/cis_level2.yml
#
# Variables applied to every host in the [cis_level2] group.
# Level 2 includes all Level 1 controls plus additional, stricter ones.
# Test thoroughly — some Level 2 controls may impact running services.

# Debian 12 role level flags
deb12cis_level_1: true
deb12cis_level_2: true

# Ubuntu 22.04 role level flags
ubtu22cis_level_1: true
ubtu22cis_level_2: true
